":"body","start":12,"length":1,"trans":"兔子<mark>跑着</mark>撞到树桩上，折断脖子死了。","clue":"“触株”是撞上树桩。联系故事，兔子正在奔跑。","learned":true}]},{"id":"zou-run--kuafu","title":"夸父逐日","body":"夸父与日逐走，入日。渴，欲得饮，饮于河、渭；河、渭不足，北饮大泽。未至，道渴而死。弃其杖，化为邓林。","meta":"《山海经·海外北经》选段","occurrences":[{"id":"zou-run--kuafu--1","senseId":"zou-run","sourceId":"kuafu","field":"body","start":5,"length":1,"trans":"夸父和太阳竞相奔跑，追赶到太阳落下的地方。","clue":"这里的“走”仍是跑。“逐走”是在奔跑中追赶。","learned":false}]}],"hao":[{"id":"hao-like--lesson","title":"论语·学习篇","body":"子曰：“知之者不如好之者，好之者不如乐之者。”","meta":"《论语·雍也》选段","occurrences":[{"id":"hao-like--lesson--1","senseId":"hao-like","sourceId":"lesson","field":"body","start":9,"length":1,"trans":"知道它的人，不如<mark>喜爱</mark>它的人。","clue":"这里在比较“知道”和“喜欢”。“好”读 hào，意思是喜爱。","learned":true},{"id":"hao-like--lesson--2","senseId":"hao-like","sourceId":"lesson","field":"body","start":13,"length":1,"trans":"喜爱它的人，不如以它为乐的人。","clue":"第二个“好”也读 hào，表示喜爱。两处“好之者”都在说喜爱它的人。","learned":true}]},{"id":"hao-like--minhaoxue","title":"敏而好学","body":"子贡问曰：“孔文子何以谓之文也？”子曰：“敏而好学，不耻下问，是以谓之文也。”","meta":"《论语·公冶长》选段","occurrences":[{"id":"hao-like--minhaoxue--1","senseId":"hao-like","sourceId":"minhaoxue","field":"body","start":23,"length":1,"trans":"他聪敏而且喜爱学习，不以向地位或学问比自己低的人请教为耻。","clue":"“好学”是喜欢学习，“好”读 hào。","learned":false}]},{"id":"hao-good--lesson","title":"春夜喜雨","body":"好雨知时节，当春乃发生。<br>随风潜入夜，润物细无声。<br>野径云俱黑，江船火独明。<br>晓看红湿处，花重锦官城。","meta":"唐 · 杜甫","poem":true,"occurrences":[{"id":"hao-good--lesson--1","senseId":"hao-good","sourceId":"lesson","field":"body","start":0,"length":1,"trans":"<mark>好</mark>雨仿佛知道时节，到了春天就降临。","clue":"这里的“好”是在称赞春雨来得及时、适宜。","learned":false}]}],"zhi":[{"id":"zhi-it--lesson","title":"论语·学习篇","body":"子曰：“学而时习之，不亦说乎？有朋自远方来，不亦乐乎？人不知而不愠，不亦君子乎？”","meta":"《论语·学而》选段","occurrences":[{"id":"zhi-it--lesson--1","senseId":"zhi-it","sourceId":"lesson","field":"body","start":8,"length":1,"trans":"学习了，还时常温习<mark>学过的内容</mark>。","clue":"“之”指的是前面所说的、学过的内容。","learned":true}]},{"id":"zhi-of--lesson","title":"学弈","body":"弈秋，通国之善弈者也。使弈秋诲二人弈，其一人专心致志，惟弈秋之为听；一人虽听之，一心以为有鸿鹄将至，思援弓缴而射之。虽与之俱学，弗若之矣。为是其智弗若与？曰：非然也。","meta":"《孟子·告子上》选段","occurrences":[{"id":"zhi-of--lesson--1","senseId":"zhi-of","sourceId":"lesson","field":"body","start":5,"length":1,"trans":"弈秋是全国<mark>的</mark>下棋高手。","clue":"把“之”替换为“的”，读一读：“全国的下棋高手”。","learned":true}]},{"id":"zhi-it--sanrenxing","title":"三人行","body":"子曰：“三人行，必有我师焉。择其善者而从之，其不善者而改之。”","meta":"《论语·述而》选段","occurrences":[{"id":"zhi-it--sanrenxing--1","senseId":"zhi-it","sourceId":"sanrenxing","field":"body","start":20,"length":1,"trans":"选择他们好的方面来学习。","clue":"这一处“之”指前面说的“善者”，也就是好的方面。后一句中的“之”指向不同的内容。","learned":false},{"id":"zhi-it--sanrenxing--2","senseId":"zhi-it","sourceId":"sanrenxing","field":"body","start":28,"length":1,"trans":"看到他们不好的方面，就改正自己也有的那些问题。","clue":"这一处“之”指“不善者”，即不好的方面；前一处“之”指好的方面。同是代词，指向的内容不同。","learned":false}]},{"id":"zhi-of--shanchuan","title":"答谢中书书","body":"山川之美，古来共谈。高峰入云，清流见底。两岸石壁，五色交辉。青林翠竹，四时俱备。","meta":"陶弘景《答谢中书书》选段","occurrences":[{"id":"zhi-of--shanchuan--1","senseId":"zhi-of","sourceId":"shanchuan","field":"body","start":2,"length":1,"trans":"山川的美丽，自古以来就是人们共同谈论的话题。","clue":"“山川之美”就是“山川的美”，这里的“之”连接前后两部分。","learned":false}]},{"id":"zhi-of--weixue","title":"为学","body":"蜀之鄙有二僧，其一贫，其一富。贫者语于富者曰：“吾欲之南海，何如？”富者曰：“子何恃而往？”","meta":"彭端淑《为学一首示子侄》选段","occurrences":[{"id":"zhi-of--weixue--1","senseId":"zhi-of","sourceId":"weixue","field":"body","start":1,"length":1,"trans":"蜀地的边远地方有两个和尚，一个贫穷，一个富有。","clue":"这里的“之”相当于“的”，连接“蜀”和“鄙”，表示蜀地的边远地方。","learned":false},{"id":"zhi-go--weixue--1","senseId":"zhi-go","sourceId":"weixue","field":"body","start":26,"length":1,"trans":"穷和尚对富和尚说：“我想去南海，怎么样？”","clue":"“南海”是要去的地方。“之南海”就是去南海。","learned":false}]},{"id":"zhi-go--lesson","title":"黄鹤楼送孟浩然之广陵","body":"故人西辞黄鹤楼，烟花三月下扬州。<br>孤帆远影碧空尽，唯见长江天际流。","meta":"唐 · 李白 · 这个用法出现在诗题里","poem":true,"occurrences":[{"id":"zhi-go--lesson--1","senseId":"zhi-go","sourceId":"lesson","field":"title","start":7,"length":1,"trans":"送别孟浩然，孟浩然要<mark>去</mark>广陵。","clue":"“之”后面的“广陵”是目的地，联系诗题，这里表示去往。","learned":false}]}],"shan":[{"id":"shan-skilled--lesson","title":"学弈","body":"弈秋，通国之善弈者也。使弈秋诲二人弈，其一人专心致志，惟弈秋之为听；一人虽听之，一心以为有鸿鹄将至，思援弓缴而射之。虽与之俱学，弗若之矣。为是其智弗若与？曰：非然也。","meta":"《孟子·告子上》选段","occurrences":[{"id":"shan-skilled--lesson--1","senseId":"shan-skilled","sourceId":"lesson","field":"body","start":6,"length":1,"trans":"弈秋是全国<mark>擅长</mark>下棋的人。","clue":"“弈”是下棋。“善”放在“弈”前，告诉我们他很会下棋。","learned":true}]},{"id":"shan-skilled--maiyouweng","title":"卖油翁","body":"陈康肃公善射，当世无双，公亦以此自矜。尝射于家圃，有卖油翁释担而立，睨之久而不去。见其发矢十中八九，但微颔之。","meta":"欧阳修《卖油翁》选段","occurrences":[{"id":"shan-skilled--maiyouweng--1","senseId":"shan-skilled","sourceId":"maiyouweng","field":"body","start":4,"length":1,"trans":"陈康肃公擅长射箭，当时没有人能和他相比。","clue":"“善射”是擅长射箭，和“善弈”一样，说的是本领。","learned":false}]}]},"output":{"zou-run":{"prompt":"想一个“谁跑开了”的小情境。","hint":"先用今天的话说，再试着用“走”表示“跑”。","frame":"____见____，走。","example":"兔见人，走。","check":"这里的“走”是在说跑吗？"},"hao-like":{"prompt":"说一件你喜欢做的事。","hint":"用“好”表示喜欢，读 hào。","frame":"吾好____。","example":"吾好读书。","check":"“好”后面是不是你喜欢做的事？"},"hao-good":{"prompt":"说说怎样的一场雨，可以称为“好雨”。","hint":"可以用今天的话写一句，带上“好雨”。","frame":"这是一场好雨，因为____。","example":"这是一场好雨，因为它让干燥的土地喝饱了水。","check":"你说清楚这场雨好在哪里了吗？"},"zhi-it":{"prompt":"先说一个事物，再用“之”代替它。","hint":"想一想：别人能知道你说的“之”指什么吗？","frame":"得一____，____之。","example":"得一书，读之。","check":"“之”能找到前面对应的事物吗？"},"zhi-of":{"prompt":"用“之”连接两个部分，先写一个短语也可以。","hint":"先说“谁的什么”，再试着把“的”换成“之”。","frame":"____之____。","example":"春日之花，甚美。","check":"换成“的”以后，意思还通顺吗？"},"zhi-go":{"prompt":"说一说，你想去哪个地方。","hint":"用“之”表示去，后面接目的地。“吾”就是我。","frame":"吾欲之____。","example":"吾欲之广陵。","check":"“之”后面是要去的地方吗？"},"shan-skilled":{"prompt":"说一说你或朋友擅长做什么。","hint":"用“善”表示擅长。“弈”是下棋，“书”可以表示书写。","frame":"吾善____。","example":"吾善弈。","check":"“善”后面说的是一种本领吗？"}},"grammar":{"实词":{"title":"实词：说出具体内容","text":"这类词可以告诉我们：是谁、是什么、做什么、什么样，或者有多少。","example":"比如：“兔”说的是一种动物；“走”在“兔走触株”里说的是跑这个动作。"},"虚词":{"title":"虚词：帮助表达关系","text":"读文言文时，有些词主要帮我们指代、连接，或者表达语气。把它们放回句子里，才能知道这里怎样理解。","example":"比如：“之”有时帮我们代指前面说过的内容，有时相当于“的”。"},"名词":{"title":"名词：给人或事物起名字","text":"表示人、事物、地方或时间等名称的词。","example":"比如“人”“兔”“山”“春”。"},"动词":{"title":"动词：说动作或变化","text":"告诉我们做什么，或者发生了什么变化。","example":"比如跑、读书、去。“走”表示跑时，就是动词。"},"形容词":{"title":"形容词：说是什么样","text":"告诉我们人或事物的特点、样子或状态。","example":"比如“大”“小”“美”。“好雨”的“好”是在说雨好。"},"数词":{"title":"数词：说有多少","text":"表示数量或顺序的词。","example":"比如“一”“二”“三”。"},"量词":{"title":"量词：说数量的单位","text":"常和数词一起，说明人、事物或动作的数量单位。","example":"比如“一本书”的“本”。"},"代词":{"title":"代词：代替前面说过的内容","text":"可以代替人、事物或某些内容，让我们不用把它们再说一遍。","example":"读到代词时，问问自己：它代替的是谁，或者什么？"},"副词":{"title":"副词：补充说明动作或特点","text":"常放在动词或形容词前，补充程度、范围、时间等信息。","example":"比如“甚美”的“甚”，相当于“很”。"},"介词":{"title":"介词：引出相关的人或事物","text":"常和后面的词一起，说明动作和谁有关、在哪里发生等。","example":"比如“学于人”的“于”，和“人”一起表示向别人学习。"},"连词":{"title":"连词：把词语或句子连起来","text":"连接前后的内容，帮助我们理解它们之间的关系。","example":"比如“学而时习之”的“而”，把学习和温习连接起来。"},"助词":{"title":"助词：帮句子搭起来","text":"有的帮助词语组合，有的帮助表达语气，要结合位置来理解。","example":"比如“山川之美”的“之”，把“山川”和“美”连起来，相当于“的”。"},"叹词":{"title":"叹词：发出感叹","text":"表示惊讶、感慨等声音或语气。","example":"比如“呜呼”可以表达感叹。"}},"art":{"zou-run":{"normal":"<svg class=\"scene\" id=\"meaning-scene\" viewBox=\"0 0 560 290\" role=\"img\" aria-label=\"词义情境演示\"><rect width=\"560\" height=\"290\" fill=\"#e9eddb\"/><circle cx=\"455\" cy=\"60\" r=\"28\" fill=\"#f4d58b\"/><path d=\"M0 165Q90 96 176 159T347 146T560 151V290H0Z\" fill=\"#d4ddbb\"/><path d=\"M0 207Q140 159 268 198T560 189V290H0Z\" fill=\"#c5d2ac\"/><path d=\"M0 260Q150 217 290 244T560 237V290H0Z\" fill=\"#b5c599\"/><path d=\"M34 77h47m-16-8h40M356 41h32\" stroke=\"#fffdf0\" stroke-width=\"6\" stroke-linecap=\"round\"/><line x1=\"280\" y1=\"48\" x2=\"280\" y2=\"249\" stroke=\"#fff8e9\" stroke-width=\"2\" stroke-dasharray=\"5 6\"/><rect x=\"81\" y=\"34\" width=\"111\" height=\"30\" rx=\"15\" fill=\"#fffaf0\"/><text x=\"137\" y=\"54\" text-anchor=\"middle\" fill=\"#7e896e\" font-size=\"13\">今天说的走路</text><rect x=\"348\" y=\"34\" width=\"133\" height=\"30\" rx=\"15\" fill=\"#2f7058\"/><text x=\"414\" y=\"54\" text-anchor=\"middle\" fill=\"#fffaf0\" font-size=\"13\">这句里的「走」</ 位教你本领的人，用“诲”写一句。","hint":"“诲”是谁在做？是老师在教学生。","frame":"先生诲____。","example":"先生诲我读书。","check":"句子里能看出是谁教谁吗？"},"zhi-of":{"prompt":"先说“谁的什么”，再把“的”换成“之”，写短语也可以。","hint":"在这一处，把“之”换成“的”，意思就容易懂了。","frame":"____之____。","example":"春日之花，甚美。","check":"换成“的”以后还通顺吗？"},"zhi-it":{"prompt":"先说一个事物，再用“之”代替它，写成一句。","hint":"先问“之”代替什么，再联系上下文找答案。","frame":"得一____，____之。","example":"得一书，读之。","check":"别人能从前文找到“之”指什么吗？"},"ju-together":{"prompt":"说说你和谁一起做什么，用上“俱”。","hint":"“俱”放在“学”前，告诉我们是一起学。","frame":"吾与____俱____。","example":"吾与友人俱学。","check":"能看出是两个人或更多人一起吗？"},"fu-not":{"prompt":"用“弗”表示不，写一个短句。“知”就是知道。","hint":"这里把“弗”换成“不”，再读一遍。","frame":"____弗____。","example":"吾弗知。","check":"“弗”换成“不”后意思一样吗？"},"hao-like":{"prompt":"说一件你喜欢做的事，用“好”表示喜欢。","hint":"这里读 hào，和“爱好”的“好”同音。","frame":"吾好____。","example":"吾好读书。","check":"“好”后面说的是喜欢的事吗？"},"shi-often":{"prompt":"说说你会按时做的学习活动，用上“时”。","hint":"这里的“时”修饰“习”，说的是温习的时间。","frame":"吾时____。","example":"吾时习所学。","check":"这里的“时”是不是在说明什么时候做？"},"xi-review":{"prompt":"说说你准备温习什么，用“习”写一句。","hint":"“学”是学到新内容，“习”是再温习、练习。","frame":"吾习____。","example":"吾习所学。","check":"写的是温习、练习学过的内容吗？"},"shuo-pleased":{"prompt":"想象学会一种本领后的心情，用“说”写一句，可以照着句式试试。","hint":"在这个意思里读 yuè，不读 shuō。","frame":"习有所获，不亦____乎？","example":"习有所获，不亦说乎？","check":"这里表达的是愉快吗？朗读时读 yuè。"},"le-enjoy":{"prompt":"想一种让你觉得有趣的学习活动，用“乐之”写一句。","hint":"“乐之”是以学习它为乐；这里读 lè。","frame":"吾读书而____之。","example":"吾读书而乐之。","check":"句子有没有表达以这件事为乐？"}},"media":{"zou-run":[{"format":"mp4","src":"media/real-lesson/zou-run.mp4","poster":"media/real-lesson/zou-run.png","title":"听讲解 · 跑","alt":"迈开腿，快速向前跑。"},{"format":"png","src":"media/real-lesson/zou-run.png","title":"记忆卡 · 跑","alt":"迈开腿，快速向前跑。 “兔走触株”说兔子跑着撞上了树桩。“走”在这里是跑。"},{"format":"jpg","src":"media/real-lesson/rabbit.jpg","title":"看看课文情境","alt":"《守株待兔》教学情境插画"}],"zhu-stump":[{"format":"mp4","src":"media/real-lesson/zhu-stump.mp4","poster":"media/real-lesson/zhu-stump.png","title":"听讲解 · 树桩","alt":"树砍去后，留下的根和短短的树干。"},{"format":"png","src":"media/real-lesson/zhu-stump.png","title":"记忆卡 · 树桩","alt":"树砍去后，留下的根和短短的树干。 田里的“株”是树桩。兔子撞上它，农夫后来又守在它旁边。"},{"format":"jpg","src":"media/real-lesson/rabbit.jpg","title":"看看课文情境","alt":"《守株待兔》教学情境插画"}],"shi-release":[{"format":"mp4","src":"media/real-lesson/shi-release.mp4","poster":"media/real-lesson/shi-release.png","title":"听讲解 · 放下","alt":"把手里的东西放下来。"},{"format":"png","src":"media/real-lesson/shi-release.png","title":"记忆卡 · 放下","alt":"把手里的东西放下来。 “释其耒”是放下他的农具。农夫停止耕田，守着树桩等兔子。"},{"format":"jpg","src":"media/real-lesson/farmer-wait.jpg","title":"看看课文情境","alt":"《守株待兔》教学情境插画"}],"ji-hope":[{"format":"mp4","src":"media/real-lesson/ji-hope.mp4","poster":"media/real-lesson/ji-hope.png","title":"听讲解 · 希望","alt":"心里盼望一件事发生。"},{"format":"png","src":"media/real-lesson/ji-hope.png","title":"记忆卡 · 希望","alt":"心里盼望一件事发生。 农夫想再捡到撞死的兔子。“冀复得兔”就是希望再得到兔子。"},{"format":"jpg","src":"media/real-lesson/farmer-wait.jpg","title":"看看课文情境","alt":"《守株待兔》教学情境插画"}],"yi-go":[{"format":"mp4","src":"media/real-lesson/yi-go.mp4","poster":"media/real-lesson/yi-go.png","title":"听讲解 · 下围棋","alt":"在棋盘上落子，下围棋。"},{"format":"png","src":"media/real-lesson/yi-go.png","title":"记忆卡 · 下围棋","alt":"在棋盘上落子，下围棋。 “善弈”是擅长下围棋。“诲二人弈”是教两个人下围棋。"},{"format":"jpg","src":"media/real-lesson/go-teacher.jpg","title":"看看课文情境","alt":"《学弈》教学情境插画"}],"shan-skilled":[{"format":"mp4","src":"media/real-lesson/shan-skilled.mp4","poster":"media/real-lesson/shan-skilled.png","title":"听讲解 · 擅长","alt":"很会做一件事，有这方面的本领。"},{"format":"png","src":"media/real-lesson/shan-skilled.png","title":"记忆卡 · 擅长","alt":"很会做一件事，有这方面的本领。 弈秋下围棋很厉害。“善弈”就是擅长下围棋。"},{"format":"jpg","src":"media/real-lesson/go-teacher.jpg","title":"看看课文情境","alt":"《学弈》教学情境插画"}],"hui-teach":[{"format":"mp4","src":"media/real-lesson/hui-teach.mp4","poster":"media/real-lesson/hui-teach.png","title":"听讲解 · 教导","alt":"把知识或本领教给别人。"},{"format":"png","src":"media/real-lesson/hui-teach.png","title":"记忆卡 · 教导","alt":"把知识或本领教给别人。 “诲二人弈”是教两个人下围棋。弈秋是老师，两个人是学生。"},{"format":"jpg","src":"media/real-lesson/go-teacher.jpg","title":"看看课文情境","alt":"《学弈》教学情 ning","packageIds":["intro","reading"],"order":14}],"lessons":[{"id":"rabbit","title":"守株待兔","meta":"《韩非子·五蠹》节选","image":"rabbit","body":"宋人有耕者。田中有株。兔走触株，折颈而死。<br>因释其耒而守株，冀复得兔。兔不可复得，而身为宋国笑。","url":"https://www.edb.gov.hk/attachment/tc/curriculum-development/kla/chi-edu/recommended-passages/KS1_01_text.pdf","audioText":"守株待兔。宋人有耕者。田中有株。兔走触株，折颈而死。因释其垒而守株，冀复得兔。兔不可复得，而身为宋国笑。"},{"id":"go","title":"学弈","meta":"《孟子·告子上》节选","image":"go-teacher","body":"弈秋，通国之善弈者也。使弈秋诲二人弈，其一人专心致志，惟弈秋之为听；<br>一人虽听之，一心以为有鸿鹄将至，思援弓缴而射之。<br>虽与之俱学，弗若之矣。为是其智弗若与？曰：“非然也。”","url":"https://www.edb.gov.hk/attachment/tc/curriculum-development/kla/chi-edu/recommended-passages/KS2_02.pdf","audioText":"学弈。弈秋，通国之善弈者也。使弈秋诲二人弈，其一人专心致志，惟弈秋之为听。一人虽听之，一心以为有鸿鹄将至，思援弓浊而射之。虽与之俱学，弗若之矣。为是其智弗若余？曰，非然也。"},{"id":"analects","title":"论语·学习篇","meta":"学习主题选编：《学而》1.1、《雍也》6.20","image":"study","body":"子曰：“学而时习之，不亦说乎？有朋自远方来，不亦乐乎？人不知而不愠，不亦君子乎？”<br><br>子曰：“知之者不如好之者，好之者不如乐之者。”","url":"https://ctext.org/analects/xue-er","extraUrl":"https://jjw.bjmtg.gov.cn/jjw/lzwh/202404/92b5cbaae9ea4ba8bc54ae5f158bd738.shtml","audioText":"论语，学习篇。学而第一，第一章。子曰，学而时习之，不亦悦乎？有朋自远方来，不亦乐乎？人不知而不愠，不亦君子乎？雍也第六，第二十章。子曰，知之者不如好之者，好之者不如乐之者。"}]}};</script><script>(()=>{

function tile(w,list=w.senses){const all=w.senses.map(x=>S(x.id)).filter(learned),pending=all.filter(x=>!reviewed(x)).length,shown=[...list].map(x=>S(x.id)).sort(senseOrder),expanded=!!ui.expandedWords[w.id],extra=shown.length-2;return `<article class="v15-word-group" data-word="${w.id}" aria-label="${w.word}的意思"><header class="v15-word-label"><h2>${miGrid(w.word)}</h2><strong>${pending?pending+' 个待复习':all.length?'全部已复习':'待解锁'}</strong><small>${all.length} 个已解锁意思</small></header><div class="v16-meaning-list">${extra>0?`<div class="v16-expansion-bar"><span>${expanded?'已展开 '+shown.length+' 个意思':'已显示 2 / '+shown.length+' 个意思'}</span>${btn('toggle-meanings',`${expanded?'收起更多意思':'展开其余 '+extra+' 个意思'} ${icon('down')}`,'v16-expand',`data-word="${w.id}" aria-expanded="${expanded}" aria-controls="extra-${w.id}"`)}</div>`:''}<div class="v15-sense-grid">${shown.slice(0,2).map(x=>senseTile(x,w)).join('')}</div>${extra>0?`<div class="v15-sense-grid v16-extra" id="extra-${w.id}" ${expanded?'':'hidden'}>${expanded?shown.slice(2).map(x=>senseTile(x,w)).join(''):''}</div>${expanded?btn('toggle-meanings','收起，回到这个字 '+icon('down'),'v16-collapse-bottom',`data-word="${w.id}" aria-expanded="true" aria-controls="extra-${w.id}"`):''}`:''}</div></article>`}

const packageName=id=>C.packages.find(p=>p.id===id)?.name||'全部课包';
const categoryName=id=>C.groups.find(g=>g.id===id)?.name||'全部分类';
const unlockedCourse=title=>db.articleUnlocks[title]?articleSenses(title).filter(learned):[];
function courseMatches(f={packageId:ui.packageId,group:ui.group,sort:ui.courseSort}){const q=ui.courseQuery.trim().replace(/[《》]/g,'');return C.catalog.filter(c=>(!q||c.title.includes(q))&&(f.packageId==='all'||c.packageIds.includes(f.packageId))&&(f.group==='all'||c.categoryId===f.group)&&!!db.articleUnlocks[c.title]).sort((a,b)=>{if(f.sort==='order'){const pkg=C.packages.findIndex(p=>p.id===a.packageIds[0])-C.packages.findIndex(p=>p.id===b.packageIds[0]);return (f.packageId==='all'?pkg:0)||a.order-b.order}const last=c=>db.articleUnlocks[c.title]||0;return last(b)-last(a)||a.order-b.order})}
function courseCard(c){const ss=unlockedCourse(c.title),available=articleSenses(c.title).length>0,pack=c.packageIds.map(packageName).join('、');return `<article class="lookup-card course-card" data-course-id="${c.id}" aria-label="《${esc(c.title)}》，${ss.length} 个已解锁意思"><header class="lookup-card-head course-card-head"><div><h2 title="《${esc(c.title)}》">《${esc(c.title)}》</h2><p title="${esc(pack)}">${categoryName(c.categoryId)} · ${esc(packageName(c.packageIds[0]))}${c.packageIds.length>1?'等 '+c.packageIds.length+' 个课包':''}</p></div><span class="course-learned">已学</span></header><div class="lookup-meanings">${ss.length?ss.slice(0,3).map((x,i)=>cardSense(x,i,c.title)).join(''):`<div class="locked-course"><span>${icon('book')}</span><p>本篇暂无已解锁字词。</p></div>`}</div>${btn('lesson',`<span>${ss.length>3?`<b class="three-dots">···</b>还有 ${ss.length-3} 个意思`:`本篇解锁 ${ss.length} 个意思`}</span><small>查看本课</small>${icon('next')}`,'lookup-card-foot',`data-course="${esc(c.title)}"`)}</article>`}
function courseControls(){return `<div class="course-controls">${btn('course-filter',`${ui.packageId==='all'?'全部课包':esc(packageName(ui.packageId))}⌄`,'course-control','aria-haspopup="dialog"')}${btn('course-sort',(ui.courseSort==='recent'?'最近学过':'课程顺序')+'⌄','sort-trigger','aria-haspopup="dialog"')}</div>`}
function courseCategories(){return `<nav class="course-category-bar" aria-label="文章分类">${[{id:'all',name:'全部分类'},...C.groups].map(g=>btn('course-category',esc(g.name),'course-category',`data-group="${g.id}" aria-pressed="${ui.group===g.id}"`)).join('')}</nav>`}

function root(){const m=route.mode;ui.mode=m;return `<header class="top lookup-top"><h1 class="sr-only">找字词</h1><span class="v15-brand">我的字词</span><nav class="peer-tabs" aria-label="查找方式">${['words','courses'].map((x,i)=>btn('mode',['按字词找','按课文找'][i],'',`data-mode="${x}" aria-current="${m===x?'page':'false'}"`)).join('')}</nav>${m==='words'?'<span class="lookup-total"></span>':''}</header><main class="collection-scroll lookup-scroll" data-scroll="collection"><div class="search-row ${m==='courses'?'course-search-row':''}"><label class="search-field">${icon('search')}<input id="lookup" aria-label="${m==='words'?'搜索字词或拼音':'搜索课文标题'}" placeholder="${m==='words'?'字词 / 拼音，如：好 / hào / hao4':'输入文章名，如：学弈'}" value="${esc(ui[m==='words'?'wordQuery':'courseQuery'])}" autocomplete="off" enterkeyhint="search">${btn('clear-search','×','clear','aria-label="清空搜索"')}</label>${m==='words'?btn('filter',`${icon('filter')}筛选${activeFilters()?`<b>${activeFilters()}</b>`:''}`,'filter-button','aria-haspopup="dialog"')+btn('sort',(ui.filter.sort==='oldest'?'早解锁在前':'新解锁在前')+'⌄','word-sort-control','aria-haspopup="dialog" aria-label="更改字词排序"'):courseControls()}</div><div id="results">${rootResults()}</div></main>`}
function activeFilters(){return Number(ui.filter.status!=='learned')+Number(ui.filter.broad!=='all')+Number(ui.filter.type!=='all')}
const norm=t=>String(t).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim();
const statusLabel={learned:'全部已解锁',pending:'待复习',practiced:'已复习',all:'包含未学',preview:'还没学'};
function matchingWords(f=ui.filter,ignoreInitial=false){const q=ui.wordQuery.trim().toLowerCase(),n=norm(q),toned=/[āáǎàēéěèīíǐìōóǒòūúǔùǖǘǚǜ]/.test(q);const ws=words.map(w=>({w,ss:w.senses.filter(s=>(ignoreInitial||ui.initial==='all'||norm(s.pinyin).charAt(0).toUpperCase()===ui.initial)&&(!q||w.word.includes(q)||s.meaning.includes(q)||(toned?s.pinyin===q:norm(s.pinyin).includes(n)||s.search.split(' ').includes(n)))&&(f.status==='all'||(f.status==='preview'?!learned(s):learned(s)&&(f.status==='pending'?!reviewed(s):f.status==='practiced'?reviewed(s):true)))&&(f.broad==='all'||broad(s)===f.broad)&&(f.type==='all'||s.type===f.type))})).filter(x=>x.ss.length);const rank=s=>!learned(s)?2:reviewed(s)?1:0;const value=x=>{const pending=x.ss.filter(s=>rank(s)===Math.min(...x.ss.map(rank))),times=pending.map(s=>db.unlockTimes[s.id]||0);return f.sort==='oldest'?Math.min(...times):Math.max(...times)};for(const x of ws)x.ss.sort(senseOrder);return ws.sort((a,b)=>Math.min(...a.ss.map(rank))-Math.min(...b.ss.map(rank))||(f.sort==='oldest'?1:-1)*(value(a)-value(b))||compareWordPinyin(a.w,b.w))}
function alphabetIndex(ws){requestAnimationFrame(()=>{const t=$('.lookup-total');if(t)t.textContent=`${ws.length} 个字词`;const rail=$('.alphabet-scroll');if(rail){rail.scrollLeft=ui.alphabetLeft||0;updateAlphabetArrow(rail)}});const available=new Set(matchingWords(ui.filter,true).flatMap(x=>x.ss.map(s=>norm(s.pinyin).charAt(0).toUpperCase())));return `<div class="alphabet-index" aria-label="按拼音首字母筛选">${btn('initial','全部','alphabet-all',`data-letter="all" aria-pressed="${ui.initial==='all'}"`)}<div class="alphabet-scroll">${'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('').map(l=>btn('initial',l,'alphabet-letter',`data-letter="${l}" aria-label="拼音首字母 ${l}" aria-pressed="${ui.initial===l}" ${available.has(l)||ui.initial===l?'':'disabled'}`)).join('')}</div>${btn('alphabet-next',icon('next'),'alphabet-next','aria-label="向右查看更多字母"')}</div><span class="sr-only" role="status">${ws.length} 个字词</span>`}
function rootResults(){if(route.mode==='words'){const ws=matchingWords(),f=ui.filter;return `${alphabetIndex(ws)}<div class="v15-list-note"><span>未复习在前 · ${f.sort==='oldest'?'早解锁在前':'新解锁在前'}</span><span>每个意思，分别复习</span></div>${activeFilters()?`<div class="word-active-filters" aria-label="已选条件">${f.broad!=='all'?btn('remove-filter',f.broad+' ×','mini-reset','data-key="broad"'):''}${f.type!=='all'?btn('remove-filter',f.type+' ×','mini-reset','data-key="type"'):''}${f.status!=='learned'?btn('remove-filter',statusLabel[f.status]+' ×','mini-reset','data-key="status"'):''}</div>`:''}${ws.length?`<div class="word-grid" style="--card-rows:${Math.min(3,Math.max(1,...ws.map(x=>x.ss.length)))}">${ws.slice(0,ui.wordLimit).map(x=>tile(x.w,x.ss)).join('')}</div>${ws.length>ui.wordLimit?btn('more-words','再显示 12 个字词','load-more'):''}`:`<div class="empty"><h2>这里还没找到</h2><p>试试只输入一个字，或放宽筛选。</p>${btn('reset-search','查看所有字词')}</div>`}`}
const all=courseMatches(),filtered=ui.packageId!=='all'||ui.group!=='all';return `${courseCategories()}<div class="collection-meta course-result-meta"><span>${all.length} 篇已学课文${ui.packageId==='all'?' · 全部课包':(' · '+esc(packageName(ui.packageId)))}${ui.group==='all'?' · 全部分类':(' · '+categoryName(ui.group))}</span>${filtered?btn('clear-course-facets','清除课包与分类','mini-reset'):''}</div>${all.length?`<div class="course-grid" style="--card-rows:${Math.min(3,Math.max(2,...all.map(c=>unlockedCourse(c.title).length)))}">${all.slice(0,ui.courseLimit).map(courseCard).join('')}</div>${all.length>ui.courseLimit?btn('more-courses',`加载更多 · 还有 ${all.length-ui.courseLimit} 篇`,'load-more'):'<p class="list-end">已显示全部已学课文</p>'}`:`<div class="empty"><h2>这些条件下没有找到文章</h2><p>试试其他分类、课包或文章名。</p>${filtered?btn('clear-course-facets','清除课包与分类'):ui.courseQuery?btn('clear-search','清空搜索'):''}</div>`}`}
function home(){
 const d=dailyRound(),count=d.ids.length,started=db.daily?.dailyDate===d.dailyDate,course=db.learned.length?S(db.learned.at(-1)).course:'',ss=senses.filter(s=>s.course===course&&learned(s)),fresh=ui.freshCourse===course&&!!course;
 const title=!count?'读完一篇文章，<br>收下新的字词':d.done?'今天的挑战，<br>完成啦！':started?'接着上次，<br>继续试一试': '这几个意思，<br>你还记得吗？';
 const glyphs=[...new Set(d.ids.map(id=>S(id).word))];
 return `<div class="mh-shell"><header class="mh-top"><div class="mh-identity"><span class="mh-brand" aria-hidden="true">${miGrid('字')}</span><h1>我的字词</h1></div><div class="mh-top-end"><span class="mh-top-note">学过的，常常遇见</span></div></header><main class="home-scroll mh-scroll" data-scroll="home"><div class="mh-workspace"><section class="mh-challenge ${d.done?'mh-done':''} ${fresh?'mh-secondary':''}" aria-labelledby="daily-heading"><div class="mh-challenge-top"><span class="mh-eyebrow">${icon(d.done?'check':'star')}每日挑战</span><span class="mh-progress" aria-label="已完成 ${d.done?count:d.index} 个，共 ${count} 个意思">${count?`${d.done?count:d.index} / ${count}`:'等待解锁'}</span></div><h2 id="daily-heading">${title}</h2><div class="mh-review-targets">${glyphs.map(w=>miGrid(w)).join('')}<p class="mh-review-note">${!count?'学完视频课后，<br>就能在这里温习。':d.done?'还想看看什么？<br>右边可以直接查找。':`最近学过的<br>${count} 个意思`}</p></div>${btn(count?'daily-challenge':'home-courses',`<span>${!count?'先看看课文':d.done?'查看完成情况':started?'继续挑战':'开始挑战'}</span>${icon(d.done?'check':'arrow')}`,'mh-start')}</section><div class="mh-right"><section class="mh-recent ${fresh?'mh-fresh':''}" aria-label="最近新学的文章与字词"><div class="mh-section-head"><h2>${fresh?'刚刚学完':'最近新学'}</h2>${ss.length?`<span class="mh-new-pill">新解锁 ${ss.length} 个意思</span>`:''}</div>${course?btn('lesson',`<span class="mh-article-title">${icon('book')}<strong>${esc(course)}</strong></span><span class="mh-article-link">${ss.length>2?'查看全部 '+ss.length+' 个':'查看本课'}${icon('next')}</span>`,'mh-article-entry',`data-course="${esc(course)}" aria-label="查看《${esc(course)}》的全部字词"`):'<div class="mh-first-lesson"><h3>等待第一篇文章</h3><p>学完视频课，新解锁的字词会收在这里。</p></div>'}<div class="mh-new-words">${ss.slice(0,2).map(s=>btn('course-sense',`${miGrid(s.word)}<span class="mh-sense-copy"><span class="mh-meaning"><span class="mh-pinyin">${s.pinyin}</span><strong>${esc(s.meaning)}</strong></span><small>${broad(s)} · ${s.type}</small></span>`,'mh-sense',`data-sense="${s.id}" data-course="${esc(course)}" aria-label="${esc(s.word)}，${s.pinyin}，${esc(s.meaning)}"`)).join('')}</div></section><nav class="mh-lookups" aria-label="字词与课文检索">${btn('home-words',`<span class="mh-lookup-icon">${miGrid('字')}</span><span class="mh-lookup-text"><strong>按字词找</strong><small>字词、拼音都能查</small></span>${icon('next')}`,'mh-lookup')}${btn('home-courses',`<span class="mh-lookup-icon">${icon('book')}</span><span class="mh-lookup-text"><strong>按课文找</strong><small>从学过的文章里找</small></span>${icon('next')}`,'mh-lookup mh-article')}</nav></div></div></main></div>`
}

function mediaItems(s){return s.media||C.media?.[s.id]||[]}
function selectedMedia(s){const items=mediaItems(s),index=Math.min(ui.mediaIndex?.[s.id]||0,Math.max(0,items.length-1));return {items,index,item:items[index]}}
function mediaFormat(item){return (item.format||item.src.split(/[?#]/)[0].split('.').pop()).toLowerCase()}
function mediaPanel(s){const {items,index,item}=selectedMedia(s),format=mediaFormat(item),video=format==='mp4',gif=format==='gif',paused=ui.mediaPaused?.[s.id+'|'+index]??matchMedia('(prefers-reduced-motion: reduce)').matches;return `<section class="v22-media" aria-label="这个意思的多媒体素材"><div class="v22-media-view" aria-busy="true">${video?`<video class="v22-media-asset" controls playsinline preload="metadata" poster="${esc(item.poster||'')}" aria-label="${esc(item.alt||item.title)}"><source src="${esc(item.src)}" type="video/mp4">当前浏览器无法播放这段视频。</video>`:`<img class="v22-media-asset" src="${esc(gif&&paused?(ui.mediaFrames?.[s.id+'|'+index]||item.poster||'data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 640 360%22%3E%3Crect width=%22640%22 height=%22360%22 fill=%22%23edf1e0%22/%3E%3Cpath d=%22M292 140v80M348 140v80%22 stroke=%22%23286346%22 stroke-width=%2220%22/%3E%3C/svg%3E'):item.src)}" alt="${esc(item.alt||item.title)}" draggable="false">`}<span class="v22-media-loading" role="status">正在加载素材…</span><div class="v22-media-error" role="status" hidden><p>素材暂时没能加载</p>${btn('media-retry','重新加载','quiet-btn')}</div></div><div class="v22-media-controls">${items.length>1?btn('media-prev',icon('back'),'icon-btn',`aria-label="上一个素材" ${index===0?'disabled':''}`):''}${btn('media-picker',`<span>${esc(item.title)}</span><small>${items.length>1?(index+1)+' / '+items.length+' · 换个素材':video?'点击播放，随时暂停':'在情境里记住它'}</small>`,'v22-media-title',items.length>1?'aria-haspopup="dialog"':'disabled')}${!video&&!gif?btn('media-zoom','放大','quiet-btn','aria-label="放大查看素材"'):''}${gif?btn('media-gif',paused?'播放':'暂停','quiet-btn',`aria-label="${paused?'播放':'暂停'}动图"`):''}${items.length>1?btn('media-next',icon('next'),'icon-btn',`aria-label="下一个素材" ${index===items.length-1?'disabled':''}`):''}</div></section>`}
function setupMedia(){const asset=document.querySelector('.v22-media-asset');if(!asset)return;const view=asset.closest('.v22-media-view'),ready=()=>{view.setAttribute('aria-busy','false');view.querySelector('.v22-media-loading').hidden=true;},failed=()=>{ready();asset.hidden=true;view.querySelector('.v22-media-error').hidden=false;};asset.addEventListener('error',failed,{once:true});if(asset.tagName==='VIDEO'){asset.querySelector('source')?.addEventListener('error',failed,{once:true});asset.addEventListener('play',()=>{stopNarration();window.speechSynthesis?.cancel()});asset.addEventListener('loadedmetadata',ready,{once:true});if(asset.readyState>=1)ready();if(asset.error)failed();}else{asset.addEventListener('load',ready,{once:true});if(asset.complete)asset.naturalWidth?ready():failed();}}

function meaning(s){const z=s.id==='zhi-it'&&!isRealDemo;return `<section class="stage meaning-stage">${mediaItems(s).length?mediaPanel(s):`<div class="art ${z?'v14-relation':''}">${z?`<p class="eyebrow">放进熟悉的句子里</p><p class="v14-quote">学而时习<mark>之</mark>。</p><div class="v14-relation-row">${miGrid(s.word)}<span class="v14-pointer">指的是${icon('arrow')}</span><strong>学过的内容</strong></div><p class="v14-art-note">“温习”的是什么？沿着前文找一找。</p>`:C.art[s.id][ui.relation[s.id]?'active':'normal']}<div class="art-caption"><span>在情境里记住它</span>${btn('sound',icon('sound')+'听情境','',`data-text="${esc(s.short)}"`)}</div></div>`}<div class="meaning-copy" data-scroll="meaning"><p class="eyebrow">${learned(s)?'这个意思怎么理解':'这个意思还没学 · 可以先看看'}</p><h2>${z?'替前面说过的内容，<br>再说一次。':esc(s.short)}</h2><p class="explanation">${z?'前面说“学习”，后面再提学过的内容，就可以用一个“之”来代替。':esc(s.explain)}</p><p class="remember">${esc(s.tip)}</p></div></section>`}

function docList(s){return C.docs[s.wordId]||[]}
function readingSelection(s){const ds=docList(s).filter(d=>d.occurrences.some(o=>o.senseId===s.id));let d=ds.find(d=>d.id===route.doc&&d.occurrences.some(o=>o.senseId===s.id));if(!d)d=ds.find(d=>d.occurrences.some(o=>o.senseId===s.id));let o=d.occurrences.find(o=>o.id===route.occ&&o.senseId===s.id)||d.occurrences.find(o=>o.senseId===s.id);route.doc=d.id;route.occ=o.id;return{ds,d,o}}
function marked(text,field,d){let out=text;d.occurrences.filter(o=>o.field===field&&o.senseId===route.sense).sort((a,b)=>b.start-a.start).forEach(o=>{const raw=text.slice(o.start,o.start+o.length);out=out.slice(0,o.start)+btn('occ',esc(raw),'text-hit',`data-occ="${o.id}" aria-pressed="${route.occ===o.id}" aria-label="查看此处${esc(raw)}表示${esc(S(route.sense).meaning)}的用法"`)+out.slice(o.start+o.length)});return out}
function articleTabs(ds,d){const result=ds.filter(x=>x.occurrences.some(o=>o.senseId===route.sense)&&(!ui.articleQuery||x.title.includes(ui.articleQuery))&&(ui.articleScope==='all'||!!db.articleUnlocks[x.title]));return `<div class="article-tabs" data-scroll="articles">${result.length?result.map(x=>btn('article',esc(x.title),'article-tab',`data-doc="${x.id}" aria-current="${d.id===x.id}"`)).join(''):'<span class="muted">没有匹配的文章，换个标题试试。</span>'}</div>`}
function articlePickerResults(s){const {d}=readingSelection(s),list=docList(s).filter(x=>x.occurrences.some(o=>o.senseId===s.id)&&(!ui.articleQuery||x.title.includes(ui.articleQuery))&&(ui.articleScope==='all'||!!db.articleUnlocks[x.title]));return list.length?list.map(x=>{const os=x.occurrences.filter(o=>o.senseId===s.id),isLearned=!!db.articleUnlocks[x.title];return btn('source-select',`<span><strong>《${esc(x.title)}》 ${sourceNew(s,x)?'<em class="v15-new-badge">新</em>':''}</strong><small>${esc(plain(x.body).slice(0,32))}${plain(x.body).length>32?'…':''} · ${isLearned?'已学':'拓展阅读'}</small></span><b>${os.length} 处</b>${icon(x.id===d.id?'check':'next')}`,'v14-source-choice',`data-doc="${x.id}" aria-pressed="${x.id===d.id}"`)}).join(''):'<div class="empty"><h3>没有找到这篇文章</h3><p>试试其他标题，或切到全部。</p></div>'}
function sourceStrip(s,d,ds){return `<div class="v26-source-strip ${ui.sourceExpanded?'is-expanded':''}"><nav id="reading-source-list" class="v26-source-list" aria-label="切换文章，仍查看当前意思">${ds.map(x=>btn('source-inline',`<span class="v26-source-name">《${esc(x.title)}》</span><small>${x.occurrences.filter(o=>o.senseId===s.id).length} 处</small>${sourceNew(s,x)?'<em class="v15-new-badge">新</em>':''}`,'v26-source-chip',`data-doc="${esc(x.id)}" aria-current="${x.id===d.id?'page':'false'}" aria-label="《${esc(x.title)}》，这个意思出现 ${x.occurrences.filter(o=>o.senseId===s.id).length} 处${sourceNew(s,x)?'，有新原文':''}"`)).join('')}</nav>${btn('source-expand',ui.sourceExpanded?'收起 '+icon('down'):'展开全部 '+icon('down'),'v26-source-expand',`aria-expanded="${!!ui.sourceExpanded}" aria-controls="reading-source-list"`)}${btn('read-passage',icon('sound'),'body-listen v26-read-audio','aria-label="听这篇原文"')}</div>`}
function fitSourceStrip(){const rail=document.querySelector('.v26-source-list'),toggle=document.querySelector('[data-action="source-expand"]');if(!rail||!toggle)return;toggle.hidden=!ui.sourceExpanded;if(!ui.sourceExpanded){toggle.hidden=rail.scrollWidth<=rail.clientWidth+1;const selected=rail.querySelector('[aria-current="page"]');if(selected){const a=selected.getBoundingClientRect(),r=rail.getBoundingClientRect();if(a.left<r.left)rail.scrollLeft+=a.left-r.left;else if(a.right>r.right)rail.scrollLeft+=a.right-r.right;}}}
function reading(s){const{ds,d,o}=readingSelection(s),os=d.occurrences.filter(x=>x.senseId===s.id),i=os.findIndex(x=>x.id===o.id);return `<section class="stage reading-stage">${sourceStrip(s,d,ds)}<div class="reading-workspace"><article class="passage-pane" data-scroll="passage"><p class="source-byline"><strong>《${esc(d.title)}》</strong><br>${esc(d.meta||'文言原文')}</p>${d.occurrences.some(x=>x.field==='title')?`<h2 class="passage-title">${marked(d.title,'title',d)}</h2>`:''}<div class="original">${marked(d.body,'body',d)}</div><p class="reading-help">高亮的“${esc(s.word)}”都表示“${esc(s.meaning)}”，点一点看它在句中的用法。</p></article><aside class="gloss-pane" aria-label="当前选中位置的解释"><div class="gloss-content" data-scroll="gloss"><p class="eyebrow">这一处的“${esc(s.word)}”</p><h2>${s.id==='zhi-it'&&d.title==='三人行'?(i===0?'指别人的优点':'指别人的缺点'):esc(s.meaning)}</h2><p class="translation">${o.trans}</p><p class="clue">${o.clue}</p></div><nav class="occ-nav" aria-label="这篇文章中同一意思的位置">${btn('occ-prev',icon('back'),'icon-btn',`aria-label="上一个同义位置" ${i===0?'disabled':''}`)}<span>第 ${i+1} / ${os.length} 处<br>同一个意思</span>${btn('occ-next',icon('next'),'icon-btn',`aria-label="下一个同义位置" ${i===os.length-1?'disabled':''}`)}</nav></aside></div></section>`}

function answerPanel(s,review=false){const r=review?db.round:null,a=review?r.choice:ui.practice[s.id],selection=review?r.selection:ui.selections?.[s.id],submitted=a!==undefined&&a!==null,answer=review?s.reviewAnswer:s.answer,opts=review?s.reviewOptions:s.options;return `<div class="question-head"><h3>${review?s.reviewQ:s.question}</h3>${btn('sound',icon('sound'),'icon-btn',`data-text="${esc((review?s.reviewQ:s.question)+'。'+opts.join('。'))}" aria-label="听题目"`)}</div><p class="question-note">${review?s.reviewNote:s.qNote}</p><div class="answers">${opts.map((o,i)=>btn(review?'review-answer':'answer',`<span>${'ABC'[i]}</span><strong>${esc(o)}</strong>${(submitted?a:selection)===i?'<i>'+ (submitted?(i===answer?'✓':'×'):'●')+'</i>':''}`,`answer ${submitted?(a===i?(i===answer?'correct':'wrong'):''):(selection===i?'selected':'')}`,`data-index="${i}" aria-pressed="${(submitted?a:selection)===i}" ${submitted?'disabled':''}`)).join('')}</div>${submitted?`<div role="status" class="feedback ${a===answer?'':'wrong'}">${a===answer?(review?s.reviewWhy:s.why):(review?'结合前文再想一想，也可以看看提示。':s.wrong)}${a!==answer?btn(review?'review-retry':'retry','再想一想','retry'):review?'':btn('retry','重新作答','retry')}</div>`:'<p class="v14-answer-note">选好了，再确认一下。答对后接着自己造句。</p>'}`}

function practice(s){if(route.kind==='write')return compose(s);return `<section class="stage exercise-stage"><div class="practice-intro">${practiceSteps(s,false)}<h2>读读句子，<br>选出它的意思。</h2><p>先选出正确的意思，<br>再用它自己造句。</p></div><div class="question-pane" data-scroll="question">${answerPanel(s)}</div></section>`}

function compose(s){const p=C.output[s.id],draft=db.drafts[s.id]||'',saved=db.saved[s.id]===draft&&!!draft;return `<section class="stage compose-layout"><div class="compose-prompt" data-scroll="prompt">${practiceSteps(s,true)}<h2>用这个意思，<br>自己写一句。</h2><p>${esc(p.prompt)}</p><details class="inline-help"><summary>给我一点提示</summary><p>${esc(p.frame)}</p><p>写完检查一下：${esc(p.check)}</p></details></div><div class="writing-pane"><div class="v14-writing-example">可以这样开始：<strong>${esc(p.example)}</strong><small>教学自编示例 · ${esc(p.hint)}</small></div><label for="sentence">用“${esc(s.word)}”表示“${esc(s.meaning)}”，说一句话</label><textarea id="sentence" maxlength="200" placeholder="轮到你了，试着自己写一句。">${esc(draft)}</textarea><div class="draft-meta"><span id="draft-state">${saved?'这句话已保存':draft?'草稿已暂存':'写下后会自动暂存'}</span><span id="char-count">${draft.length} / 200</span></div></div></section><div class="v14-input-accessory"><span>用“${esc(s.word)}”表示“${esc(s.meaning)}”</span>${btn('finish-input','完成输入','')}</div>`}

function learning(){const s=S(route.sense),step=route.step,success=ui.practice[s.id]===s.answer,selected=Number.isInteger(ui.selections?.[s.id]),submitted=Number.isInteger(ui.practice[s.id]),saved=!!db.saved[s.id]&&db.saved[s.id]===(db.drafts[s.id]||'').trim(),done=reviewed(s),next=studySteps.find(k=>!progress(s)[k]);let label=step==='meaning'?'看懂了，回到原文':step==='reading'?'读过了，试一试':route.kind==='write'?'保存句子，完成试一试':success?'下一步，自己造句':submitted?'再想一想':'确认答案';let action=step==='meaning'?'step-reading':step==='reading'?'step-practice':route.kind==='write'?'save-sentence':success?'practice-write':submitted?'retry':'confirm-answer';if(step==='practice'&&route.kind==='write'&&saved&&progress(s).practice&&learned(s)){label=done?'完成复习，返回':next==='meaning'?'继续看懂意思':'继续回到原文';action=done?'finish-study':'step-'+next}return `${learnHeader(s)}<main class="screen-body" data-scroll="body">${step==='meaning'?meaning(s):step==='reading'?reading(s):practice(s)}</main><footer class="study-footer"><nav class="stage-nav" aria-label="学习步骤">${studySteps.map((x,i)=>btn('step-'+x,`<b class="${progress(s)[x]?'v15-step-done':''}">${progress(s)[x]?'✓':i+1}</b>${['看懂意思','回到原文','试一试'][i]}${x==='reading'&&newSources(s).length?'<em class="v15-dot" aria-label="有新原文"></em>':''}`,'',`aria-current="${step===x?'step':'false'}" aria-label="${['看懂意思','回到原文','试一试'][i]}，${progress(s)[x]?'已完成':'未完成'}"`)).join('')}</nav>${btn(action,label+icon('arrow'),'accent-btn',action==='confirm-answer'&&!selected?'disabled':'')}</footer>`}

function review(){const r=db.round;if(!r)return'';if(r.done){const results=r.results||{},helped=Object.values(results).filter(x=>x.hinted).length;return `<header class="top v14-review-top">${btn('review-exit',icon('back'),'icon-btn',`aria-label="${reviewReturnLabel()}"`)}<h1>${esc(r.label||'字词复习')}</h1><span class="top-end muted">${r.dailyDate?'今日':'本轮'}已完成 ✓</span></header><main class="screen-body v14-completion"><section class="v14-completion-summary"><div class="finish-mark">${icon('check')}</div><h2>这 ${r.ids.length} 个意思，<br>都练过啦。</h2><p>${helped?`有 ${helped} 个意思用到了提示。<br>`:''}可以再看看，也可以返回。</p></section><section class="v14-completion-list" data-scroll="completion">${r.ids.map(id=>{const s=S(id),x=results[id],label=!x?'已练习':x.hinted?'用过提示 · 再看看':x.firstCorrect?'自己答对':'再试后答对';return btn('review-detail',`${miGrid(s.word)}<span><strong>${esc(s.meaning)}</strong><small>${esc(s.pinyin)} · ${broad(s)} · ${s.type}</small></span><em class="${x?.hinted||x&&!x.firstCorrect?'needs-review':''}">${label}</em>${icon('next')}`,'v14-completion-item',`data-sense="${s.id}"`) }).join('')}</section></main><footer class="study-footer">${btn('review-again','再练一轮','quiet-btn')}${btn('review-exit',reviewReturnLabel()+icon('arrow'),'accent-btn')}</footer>`}const s=S(r.ids[r.index]),correct=r.choice===s.reviewAnswer,submitted=Number.isInteger(r.choice);return `<header class="top v14-review-top">${btn('review-exit',icon('back'),'icon-btn','aria-label="暂停并返回"')}<h1>${esc(r.label||'字词复习')}</h1><span class="v14-review-sub">${r.ids.length} 个意思</span><div class="v14-progress">${r.ids.map((_,i)=>`<span class="${i<r.index?'done':''}"></span>`).join('')}</div><span class="muted">第 ${r.index+1} / ${r.ids.length} 题</span></header><main class="screen-body"><section class="stage v14-challenge-layout"><aside class="v14-challenge-left"><div>${miGrid(s.word)}<small>${esc(s.pinyin)}</small></div><h2>换个搭配，<br>意思还认得吗？</h2><p>想一想《${esc(s.course)}》里，<br>这个字是什么意思。</p></aside><section class="question-pane" data-scroll="question">${answerPanel(s,true)}</section></section></main><footer class="study-footer review-footer">${btn('review-help','?　给我一点提示','body-listen')}<span class="v14-review-sub">随时可以暂停，下次接着来</span>${btn(correct?'review-next':submitted?'review-retry':'confirm-review',correct?(r.index===r.ids.length-1?'完成这轮':'下一题'):submitted?'再想一想':'确认答案','accent-btn',!submitted&&!Number.isInteger(r.selection)?'disabled':'')}</footer>`}

function render(){if(route.view==='learn'&&route.step==='practice'){const x=S(route.sense);if(ui.practice[x.id]===undefined&&progress(x).practiceChoice)ui.practice[x.id]=x.answer;if(route.kind==='write'&&!choiceDone(x))route.kind='choice';}if(route.view==='home')route=rootRoute();if(!['recent','oldest'].includes(ui.filter.sort))ui.filter.sort='recent';if(route.view==='learn'&&route.step==='reading'){const s=S(route.sense),{d}=readingSelection(s);if(db.articleUnlocks[d.title])db.sourceSeen[s.id+'|'+d.id]=true;ui.readViewed=route.sense+'|'+d.id;}saveLookup();const html=route.view==='home'?home():route.view==='collection'?root():route.view==='lesson'?lesson():route.view==='review'?review():learning();if(route.view==='learn'){db.seen=[route.sense,...(db.seen||[]).filter(x=>x!==route.sense)].slice(0,3);if(learned(S(route.sense)))db.lastStudy={sense:route.sense,step:route.step,kind:route.kind,doc:route.doc,occ:route.occ,scroll:ui.scrolls[scrollKey()]||{}};persist()}$('#app').innerHTML=`<div class="screen v14 v15 v16 v14-${route.view}">${html}</div>`;history.replaceState({...history.state,route},'',hash(route));restore();if(modal)renderModal();else{$('#modal').innerHTML='';$('#app').inert=false}setupMedia();size();}
function openModal(kind,sid,options={}){stopMedia();capture();returnFocus=document.activeElement;modal={kind,sid,...options};filterDraft={...ui.filter};history.pushState({...history.state,route,modal},'',hash(route));renderModal()}
function closeModal(){if(modal)history.back()}
function modalExample(s){if(route.view==='learn'&&route.step==='reading'){const{d,o}=readingSelection(s),raw=d[o.field];let start=Math.max(raw.lastIndexOf('。',o.start),raw.lastIndexOf('！',o.start),raw.lastIndexOf('？',o.start))+1;let end=raw.slice(o.start).search(/[。！？]/);end=end<0?raw.length:o.start+end+1;return raw.slice(start,o.start)+'<mark>'+raw.slice(o.start,o.start+o.length)+'</mark>'+raw.slice(o.start+o.length,end)}return s.quote}
function renderModal(){const s=S(modal.sid||route.sense);let title,body,footer;const extra=extraModal(s);if(extra){[title,body,footer]=extra}else if(modal.kind==='filter'){title='筛选字词';const f=filterDraft,types=f.broad==='虚词'?['代词','助词','副词','介词','连词','叹词']:f.broad==='实词'?['名词','动词','形容词','数词','量词']:['名词','动词','形容词','数词','量词','代词','副词','介词','连词','助词','叹词'];body=[['status','学习范围',[['learned','全部已解锁'],['pending','待复习'],['practiced','已复习'],['all','包含未学']]],['broad','词性大类',[['all','不限'],['实词','实词'],['虚词','虚词']]],['type','具体词性',[['all','不限'],...types.map(t=>[t,t])]],['sort','排列顺序',[['recent','新解锁在前'],['oldest','早解锁在前']]]].map(([key,t,opts])=>`<div class="filter-block"><h3>${t}</h3><div class="filter-choices">${key==='type'?btn('filter-types',(f.type==='all'?'不限':f.type)+' · '+(modal.typeOpen?'收起选项':'选择词性'),'filter-type-toggle',`aria-expanded="${!!modal.typeOpen}"`):''}${(key==='type'&&!modal.typeOpen?[]:opts).map(([v,l])=>btn('filter-choice',l,'filter-choice',`data-key="${key}" data-value="${v}" aria-pressed="${f[key]===v}"`)).join('')}</div></div>`).join('');footer=btn('filter-reset','重置')+btn('filter-apply','查看结果 · '+matchingWords(filterDraft).length+' 个字词','accent-btn')}else{const b=broad(s),g=C.grammar;title=b+' · '+s.type+'，是什么意思？';body=`<div class="v14-grammar-explain"><article><h3>${b}</h3><p>${esc(g[b].text)}</p></article><article><h3>${s.type}</h3><p>${esc(g[s.type].text)}</p></article></div><div class="v14-grammar-example">${modalExample(s)}<br>“${esc(s.word)}”在这里表示<strong>${esc(s.meaning)}</strong>，所以这个意思标为“${b} · ${s.type}”。</div>`;footer=btn('sound',icon('sound')+'听一听','quiet-btn',`data-text="${esc(g[b].text+g[s.type].text)}"`)+btn('modal-close','知道了','accent-btn')}
$('#modal').innerHTML=`<div class="overlay"><section class="sheet v14-sheet v14-sheet-${modal.kind}" role="dialog" aria-modal="true" aria-labelledby="sheet-title"><div class="v14-handle"></div><header class="sheet-head"><h2 id="sheet-title">${title}</h2>${btn('modal-close',icon('close'),'icon-btn','aria-label="关闭弹板"')}</header><div class="sheet-content">${body}</div><footer class="sheet-footer">${footer}</footer></section></div>`;$('#app').inert=true;$('#modal .sheet-head button').focus();}
function selectArticle(id){const s=S(route.sense),d=docList(s).find(x=>x.id===id&&x.occurrences.some(o=>o.senseId===s.id));if(!d)return;const o=d.occurrences.find(x=>x.id===ui.visits[id]&&x.senseId===s.id)||d.occurrences.find(x=>x.senseId===s.id);ui.articleSearch=false;ui.articleQuery='';ui.articleScope='all';replace({doc:id,occ:o.id});focusOccurrence();}
function selectOccurrence(id){const s=S(route.sense),{d}=readingSelection(s),o=d.occurrences.find(x=>x.id===id&&x.senseId===s.id);if(!o)return;const top=$('.passage-pane').scrollTop;ui.visits[d.id]=id;replace({occ:id});$('.passage-pane').scrollTop=top;focusOccurrence();}

function saveAnswer(index,reviewMode=false){const s=S(reviewMode?db.round.ids[db.round.index]:route.sense),correct=index===(reviewMode?s.reviewAnswer:s.answer);if(reviewMode){if(db.round.choice===s.reviewAnswer)return;db.round.results||={};const prev=db.round.results[s.id]||{};db.round.results[s.id]={...prev,attempts:(prev.attempts||0)+1,firstCorrect:prev.firstCorrect??(!db.round.tried&&correct),correct};if(!db.round.tried&&correct)db.round.firstCorrect=(db.round.firstCorrect||0)+1;db.round.tried=true;db.round.choice=index}else{if(ui.practice[s.id]===s.answer)return;ui.practice[s.id]=index}if(learned(s)){const a=db.answers[s.id]||{attempts:0,correct:0};a.attempts++;a.correct+=Number(correct);a.last=Date.now();db.answers[s.id]=a;if(correct&&!reviewMode)completePracticeTask(s,'practiceChoice')}persist();render()}
